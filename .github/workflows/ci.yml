name: Tender Index CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tender-index-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependency
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Validate Tender command
        run: |
          bash -n scripts/tender-index
          bash -n scripts/tender-project.sh
          scripts/tender-index --help

      - name: Build Tender Index
        run: scripts/build.sh

      - name: Prove build, verify, load, and search
        run: |
          fixture="$RUNNER_TEMP/tender-index-fixture"
          artifact="$RUNNER_TEMP/tender-index-artifact"
          cache="$RUNNER_TEMP/tender-index-cache"
          export TENDER_INDEX_CACHE_DIR="$cache"
          mkdir -p "$fixture/src"
          cp tests/fixtures/tender-project/sample.c "$fixture/src/sample.c"
          git -C "$fixture" init -q
          git -C "$fixture" config user.name 'Tender Index CI'
          git -C "$fixture" config user.email 'ci@tender.invalid'
          git -C "$fixture" add src/sample.c
          git -C "$fixture" commit -qm fixture
          scripts/tender-index build \
            --repo "$fixture" \
            --output "$artifact"
          scripts/tender-index verify --artifact-root "$artifact" --repo "$fixture"
          scripts/tender-index load \
            --repo "$fixture" \
            --artifact-root "$artifact"
          CBM_CACHE_DIR="$cache" build/c/codebase-memory-mcp cli --json search_graph \
            '{"query":"tender_project_query","project":"tender-index-fixture"}' \
            | grep -q 'src/sample.c'
          scripts/tender-index map --project tender-index-fixture \
            | tee "$RUNNER_TEMP/tender-map.json"
          grep -q 'map_producer.*tender.map' "$RUNNER_TEMP/tender-map.json"
          grep -q 'clusters:' "$RUNNER_TEMP/tender-map.json"

      - name: Prove isolated Tender install
        run: |
          prefix="$RUNNER_TEMP/tender-prefix"
          mkdir -p "$prefix/libexec/tender-index"
          cp /usr/bin/false "$prefix/libexec/tender-index/tender-index-engine"
          scripts/tender-index install --prefix "$prefix"
          "$prefix/bin/tender-index" doctor
          test -x "$prefix/libexec/tender-index/tender-index-engine"
          test ! -e "$HOME/.claude.json"
          test ! -e "$HOME/.codex/config.toml"
