name: Bug report
description: Report a reproducible Tender Index problem.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste proprietary code, repository contents, credentials, or private graph artifacts.
        Reproduce the issue with a small dummy project or a public repository and pinned commit.

  - type: input
    id: version
    attributes:
      label: Tender Index version
      description: Output of `tender-index version`
      placeholder: Tender Index revision ...
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x64)
        - Linux (arm64)
        - Windows (Tender installer not yet supported)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected and what occurred.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a public or synthetic project, the exact Tender command, and the result.
      placeholder: |
        Project: owner/repo @ commit (or a minimal synthetic fixture)
        Command: tender-index ...
        Result: ...
        Expected: ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Output of `tender-index doctor`, after removing private paths if necessary.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This report contains no private source, graph artifact, secret, or credential.
          required: true
